name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Weekly, so the MAF compatibility probe notices a new Microsoft.Agents.AI release, and the floating-dependency
  # leg a new release of any floored package, even in a quiet week.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Read-only, everywhere. Nothing in this workflow publishes a package, pushes a tag, or creates a release:
# only release.yml publishes, from a pushed version tag and after a reviewer approves (RELEASING.md step 10).
# AgentExperience.Release.Tests' WorkflowTests fail if a publish step, a NuGet API key, or a write permission
# ever appears in any other workflow.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Local development may roll forward (global.json: latestFeature). CI may not: the runner image ships
      # newer SDK bands, which would otherwise win. Disabling roll-forward here makes setup-dotnet install,
      # and the host select, exactly the pinned SDK. The working copy is the runner's; nothing is committed.
      - name: Pin the SDK exactly (CI only)
        run: |
          sed -i -E 's/"rollForward": *"[^"]*"/"rollForward": "disable"/' global.json
          grep -q '"rollForward": "disable"' global.json

      # The pinned SDK builds every target framework; the 8.0 and 9.0 SDKs are installed beside it, for their runtimes,
      # so the net8.0 and net9.0 test runs have a runtime to run on. The SDK in use is still exactly global.json's
      # (asserted below).
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Belt and braces after the pin above: a different SDK fails here instead of silently winning.
      - name: Assert the exact pinned SDK
        run: |
          pinned="$(sed -nE 's/.*"version": *"([^"]+)".*/\1/p' global.json)"
          actual="$(dotnet --version)"
          test "$actual" = "$pinned" || { echo "::error::SDK $actual is in use, but global.json pins $pinned"; exit 1; }
          echo "SDK $actual, as pinned"

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Every test project runs once per target framework it builds (net8.0, net9.0 and net10.0; the sample, its
      # tests and the reuse baseline are net10.0 only), against the default PostgreSQL major. The postgres
      # job below repeats the storage suites on every supported major.
      - name: Test
        run: dotnet test --no-build --configuration Release

      # Already part of the run above; repeated as a named step so a reviewer sees these three gates by name:
      # the public API baseline (a changed surface fails with a diff), the compatibility proof's agreement
      # with the shipping pins, and the consolidated security-suite map.
      - name: Release gates (public API baseline, pin agreement, security-suite map)
        run: dotnet test tests/AgentExperience.Release.Tests --no-build --configuration Release

      - name: Upload the public API diff
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-api-received
          path: tests/AgentExperience.Release.Tests/PublicApi/*.received.txt
          if-no-files-found: ignore

      # The sample's whole promise is that a stranger can clone the repository, run one command with
      # no Docker, no database and no credentials, and get the same seven stages every time. Running
      # it here is the only place that promise is checked end to end as a process: the test suite
      # exercises SampleHost, but never `dotnet run`.
      - name: Run the sample twice and diff its output
        run: |
          set -euo pipefail
          # Written outside the workspace so a local run of this script leaves no untracked files
          # behind next to the sources it just diffed.
          out="$(mktemp -d)"
          trap 'rm -rf "$out"' EXIT
          dotnet run --project samples/AgentExperience.Sample.EndToEnd --configuration Release --no-build > "$out/run-1.txt"
          dotnet run --project samples/AgentExperience.Sample.EndToEnd --configuration Release --no-build > "$out/run-2.txt"
          diff -u "$out/run-1.txt" "$out/run-2.txt"
          diff -u tests/AgentExperience.Sample.EndToEnd.Tests/GoldenTranscript.txt "$out/run-1.txt"

  # Packs the five packages and asserts, from the built .nupkg and .snupkg files rather than from the csproj
  # files: ten artifacts at 0.1.0-preview.N, license/readme/tags/repository metadata, the exact dependency set
  # of each package (so Abstractions and Core carry no adapter dependency), and SourceLink-carrying,
  # deterministic symbols. The packages are uploaded as a workflow artifact for inspection. NOT published.
  pack:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Local development may roll forward (global.json: latestFeature). CI may not: the runner image ships
      # newer SDK bands, which would otherwise win. Disabling roll-forward here makes setup-dotnet install,
      # and the host select, exactly the pinned SDK. The working copy is the runner's; nothing is committed.
      - name: Pin the SDK exactly (CI only)
        run: |
          sed -i -E 's/"rollForward": *"[^"]*"/"rollForward": "disable"/' global.json
          grep -q '"rollForward": "disable"' global.json

      # The pinned SDK builds every target framework; the 8.0 and 9.0 SDKs are installed beside it, for their runtimes,
      # so the net8.0 and net9.0 test runs have a runtime to run on. The SDK in use is still exactly global.json's
      # (asserted below).
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Belt and braces after the pin above: a different SDK fails here instead of silently winning.
      - name: Assert the exact pinned SDK
        run: |
          pinned="$(sed -nE 's/.*"version": *"([^"]+)".*/\1/p' global.json)"
          actual="$(dotnet --version)"
          test "$actual" = "$pinned" || { echo "::error::SDK $actual is in use, but global.json pins $pinned"; exit 1; }
          echo "SDK $actual, as pinned"

      - name: Restore
        run: dotnet restore --locked-mode

      # ContinuousIntegrationBuild is already on for the shipping projects under GitHub Actions
      # (Directory.Build.props); the release switch is passed explicitly so this is the same command
      # RELEASING.md runs locally.
      - name: Pack
        run: dotnet pack --no-restore --configuration Release --output artifacts/packages -p:AgentExperienceReleaseBuild=true

      - name: Verify the packages
        run: dotnet run eng/verify-packages.cs -- artifacts/packages

      - name: Upload the packages (inspection only, never published from here)
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/
          retention-days: 14

  # The PostgreSQL matrix (story 6.3, KL-13): the storage suites, the pgvector proof and the sample's PostgreSQL
  # mode, on every supported major (every target framework; the sample tests are net10.0 only). One variable picks both the pgvector image and
  # the stock one, and each suite asserts the server it reached reports that major, so a leg cannot quietly
  # run the default. The list must equal PostgresTestImage.SupportedMajors; a release test checks it.
  postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [15, 16, 17, 18]
    name: postgres (${{ matrix.postgres }})
    env:
      AGENTEXPERIENCE_POSTGRES_MAJOR: ${{ matrix.postgres }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Local development may roll forward (global.json: latestFeature). CI may not: the runner image ships
      # newer SDK bands, which would otherwise win. Disabling roll-forward here makes setup-dotnet install,
      # and the host select, exactly the pinned SDK. The working copy is the runner's; nothing is committed.
      - name: Pin the SDK exactly (CI only)
        run: |
          sed -i -E 's/"rollForward": *"[^"]*"/"rollForward": "disable"/' global.json
          grep -q '"rollForward": "disable"' global.json

      # The pinned SDK builds every target framework; the 8.0 and 9.0 SDKs are installed beside it, for their runtimes,
      # so the net8.0 and net9.0 test runs have a runtime to run on. The SDK in use is still exactly global.json's
      # (asserted below).
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Belt and braces after the pin above: a different SDK fails here instead of silently winning.
      - name: Assert the exact pinned SDK
        run: |
          pinned="$(sed -nE 's/.*"version": *"([^"]+)".*/\1/p' global.json)"
          actual="$(dotnet --version)"
          test "$actual" = "$pinned" || { echo "::error::SDK $actual is in use, but global.json pins $pinned"; exit 1; }
          echo "SDK $actual, as pinned"

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test the storage suites on PostgreSQL ${{ matrix.postgres }}
        run: |
          set -euo pipefail
          failed=0
          for project in \
            tests/AgentExperience.Storage.Postgres.Tests \
            tests/AgentExperience.Storage.Postgres.Vectors.Tests \
            tests/AgentExperience.CompatibilityProof \
            tests/AgentExperience.Sample.EndToEnd.Tests; do
            dotnet test "$project" --no-build --configuration Release || failed=1
          done
          exit "$failed"

      # Story 6.4 (KL-2): the store and vector suites again, unmodified, in crypto-shredding mode. The variable sets
      # the internal, test-only ExperienceEncryption.TestSuiteDefault, so every component a test builds without an
      # encryption of its own seals what it writes -- the whole suite, not a selection, on every framework.
      - name: Test the storage suites in crypto-shredding mode on PostgreSQL ${{ matrix.postgres }}
        env:
          AGENTEXPERIENCE_TEST_ENCRYPTION: 'on'
        run: |
          set -euo pipefail
          failed=0
          for project in \
            tests/AgentExperience.Storage.Postgres.Tests \
            tests/AgentExperience.Storage.Postgres.Vectors.Tests; do
            dotnet test "$project" --no-build --configuration Release || failed=1
          done
          exit "$failed"

  # The floating-dependency leg (story 6.3, KL-13). Every shipping reference is a floor, which admits every later
  # release in its major (Microsoft.Agents.AI's range stops at its next major, so floating within the major stays
  # inside it). The build-and-test job proves the floors themselves;
  # this proves the newest release in each major, with the whole suite. It GATES on push and on the weekly
  # schedule: a floor makes a support claim for those versions, so a release that breaks the library breaks
  # hosts, and main must go red. On a pull request it runs and reports in the job summary but does not
  # block, so an unrelated PR is not held hostage to a release that shipped that morning (the AD-F reasoning
  # behind the MAF probe). Triage for a red run: raise the floor past the broken release, or fix the library.
  floating-dependencies:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Local development may roll forward (global.json: latestFeature). CI may not: the runner image ships
      # newer SDK bands, which would otherwise win. Disabling roll-forward here makes setup-dotnet install,
      # and the host select, exactly the pinned SDK. The working copy is the runner's; nothing is committed.
      - name: Pin the SDK exactly (CI only)
        run: |
          sed -i -E 's/"rollForward": *"[^"]*"/"rollForward": "disable"/' global.json
          grep -q '"rollForward": "disable"' global.json

      # The pinned SDK builds every target framework; the 8.0 and 9.0 SDKs are installed beside it, for their runtimes,
      # so the net8.0 and net9.0 test runs have a runtime to run on. The SDK in use is still exactly global.json's
      # (asserted below).
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Belt and braces after the pin above: a different SDK fails here instead of silently winning.
      - name: Assert the exact pinned SDK
        run: |
          pinned="$(sed -nE 's/.*"version": *"([^"]+)".*/\1/p' global.json)"
          actual="$(dotnet --version)"
          test "$actual" = "$pinned" || { echo "::error::SDK $actual is in use, but global.json pins $pinned"; exit 1; }
          echo "SDK $actual, as pinned"

      - name: Float every floor to the newest release in its major, and test
        run: eng/probe-floating-dependencies.sh

  # The MAF compatibility matrix (story 4.3, AD-F; story 7.2, KL-13). The adapter declares Microsoft.Agents.AI as a
  # range, [floor, next major). The pinned leg runs the floor, from the committed lock files, and always gates. The
  # latest leg runs the newest stable version inside the range, which a host resolves with no warning, so it is a
  # support claim too: it GATES on push and on the weekly schedule, like the floating-dependency leg, and on a pull
  # request reports PASSED or FAILED in the job summary without blocking, so an unrelated PR is not held hostage to
  # a MAF release that shipped that morning. Triage for a red latest leg: fix the adapter, or raise the floor.
  maf-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: [pinned, latest]
    continue-on-error: ${{ matrix.leg == 'latest' && github.event_name == 'pull_request' }}
    name: maf-compatibility (${{ matrix.leg }})
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Local development may roll forward (global.json: latestFeature). CI may not: the runner image ships
      # newer SDK bands, which would otherwise win. Disabling roll-forward here makes setup-dotnet install,
      # and the host select, exactly the pinned SDK. The working copy is the runner's; nothing is committed.
      - name: Pin the SDK exactly (CI only)
        run: |
          sed -i -E 's/"rollForward": *"[^"]*"/"rollForward": "disable"/' global.json
          grep -q '"rollForward": "disable"' global.json

      # The pinned SDK builds every target framework; the 8.0 and 9.0 SDKs are installed beside it, for their runtimes,
      # so the net8.0 and net9.0 test runs have a runtime to run on. The SDK in use is still exactly global.json's
      # (asserted below).
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Belt and braces after the pin above: a different SDK fails here instead of silently winning.
      - name: Assert the exact pinned SDK
        run: |
          pinned="$(sed -nE 's/.*"version": *"([^"]+)".*/\1/p' global.json)"
          actual="$(dotnet --version)"
          test "$actual" = "$pinned" || { echo "::error::SDK $actual is in use, but global.json pins $pinned"; exit 1; }
          echo "SDK $actual, as pinned"

      - name: Probe Microsoft.Agents.AI (${{ matrix.leg }})
        run: eng/probe-maf-version.sh ${{ matrix.leg == 'pinned' && 'pinned' || '' }}

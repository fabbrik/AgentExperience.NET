name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Weekly, so the MAF compatibility probe notices a new Microsoft.Agents.AI release, and the floating-dependency
  # leg a new release of any floored package, even in a quiet week.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Read-only, everywhere. Nothing in this workflow publishes a package, pushes a tag, or creates a release:
# only release.yml publishes, from a pushed version tag and after a reviewer approves (RELEASING.md step 10).
# AgentExperience.Release.Tests' WorkflowTests fail if a publish step, a NuGet API key, or a write permission
# ever appears in any other workflow.
permissions:
  contents: read

# Testcontainers pulls every Docker Hub image (pgvector/pgvector, postgres, testcontainers/ryuk) through Google's
# public Docker Hub mirror. Hosted runners share IPs, so pulling anonymously from Docker Hub hits its rate limit
# ("toomanyrequests"), which fails every container-backed test at once. The images are the same as on Docker Hub.
env:
  TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Local development may roll forward (global.json: latestFeature). CI may not: the runner image ships
      # newer SDK bands, which would otherwise win. Disabling roll-forward here makes setup-dotnet install,
      # and the host select, exactly the pinned SDK. The working copy is the runner's; nothing is committed.
      - name: Pin the SDK exactly (CI only)
        run: |
          sed -i -E 's/"rollForward": *"[^"]*"/"rollForward": "disable"/' global.json
          grep -q '"rollForward": "disable"' global.json

      # Exactly global.json's SDK (asserted below). It carries the net10.0 runtime every project targets, so nothing
      # else is installed.
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Belt and braces after the pin above: a different SDK fails here instead of silently winning.
      - name: Assert the exact pinned SDK
        run: |
          pinned="$(sed -nE 's/.*"version": *"([^"]+)".*/\1/p' global.json)"
          actual="$(dotnet --version)"
          test "$actual" = "$pinned" || { echo "::error::SDK $actual is in use, but global.json pins $pinned"; exit 1; }
          echo "SDK $actual, as pinned"

      - name: Restore
        run: dotnet restore --locked-mode

      # Story 12.1: the upgrade suite's seeders pin the published previews' packages and are not in the solution.
      # Restoring them here, locked, puts those packages in the cache, so the test step builds them without network.
      - name: Restore the upgrade seeders
        run: |
          set -euo pipefail
          for seeder in tests/AgentExperience.Upgrade.Seeders/Preview*/; do
            dotnet restore "$seeder" --locked-mode
          done

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Every test project runs on the one target framework, net10.0, against the default PostgreSQL major. The
      # postgres job below repeats the storage suites on every supported major.
      - name: Test
        run: dotnet test --no-build --configuration Release

      # Already part of the run above; repeated as a named step so a reviewer sees these three gates by name:
      # the public API baseline (a changed surface fails with a diff), the compatibility proof's agreement
      # with the shipping pins, and the consolidated security-suite map.
      - name: Release gates (public API baseline, pin agreement, security-suite map)
        run: dotnet test tests/AgentExperience.Release.Tests --no-build --configuration Release

      - name: Upload the public API diff
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-api-received
          path: tests/AgentExperience.Release.Tests/PublicApi/*.received.txt
          if-no-files-found: ignore

      # The sample's whole promise is that a stranger can clone the repository, run one command with
      # no Docker, no database and no credentials, and get the same seven stages every time. Running
      # it here is the only place that promise is checked end to end as a process: the test suite
      # exercises SampleHost, but never `dotnet run`.
      - name: Run the sample twice and diff its output
        run: |
          set -euo pipefail
          # Written outside the workspace so a local run of this script leaves no untracked files
          # behind next to the sources it just diffed.
          out="$(mktemp -d)"
          trap 'rm -rf "$out"' EXIT
          dotnet run --project samples/AgentExperience.Sample.EndToEnd --configuration Release --no-build > "$out/run-1.txt"
          dotnet run --project samples/AgentExperience.Sample.EndToEnd --configuration Release --no-build > "$out/run-2.txt"
          diff -u "$out/run-1.txt" "$out/run-2.txt"
          diff -u tests/AgentExperience.Sample.EndToEnd.Tests/GoldenTranscript.txt "$out/run-1.txt"

  # Packs the six packages and asserts, from the built .nupkg and .snupkg files rather than from the csproj
  # files: twelve artifacts at 0.1.0-preview.N, license/readme/tags/repository metadata, the exact dependency set
  # of each package (so Abstractions and Core carry no adapter dependency), and SourceLink-carrying,
  # deterministic symbols. The packages are uploaded as a workflow artifact for inspection. NOT published.
  pack:
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Local development may roll forward (global.json: latestFeature). CI may not: the runner image ships
      # newer SDK bands, which would otherwise win. Disabling roll-forward here makes setup-dotnet install,
      # and the host select, exactly the pinned SDK. The working copy is the runner's; nothing is committed.
      - name: Pin the SDK exactly (CI only)
        run: |
          sed -i -E 's/"rollForward": *"[^"]*"/"rollForward": "disable"/' global.json
          grep -q '"rollForward": "disable"' global.json

      # Exactly global.json's SDK (asserted below). It carries the net10.0 runtime every project targets, so nothing
      # else is installed.
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Belt and braces after the pin above: a different SDK fails here instead of silently winning.
      - name: Assert the exact pinned SDK
        run: |
          pinned="$(sed -nE 's/.*"version": *"([^"]+)".*/\1/p' global.json)"
          actual="$(dotnet --version)"
          test "$actual" = "$pinned" || { echo "::error::SDK $actual is in use, but global.json pins $pinned"; exit 1; }
          echo "SDK $actual, as pinned"

      - name: Restore
        run: dotnet restore --locked-mode

      # ContinuousIntegrationBuild is already on for the shipping projects under GitHub Actions
      # (Directory.Build.props); the release switch is passed explicitly so this is the same command
      # RELEASING.md runs locally.
      - name: Pack
        run: dotnet pack --no-restore --configuration Release --output artifacts/packages -p:AgentExperienceReleaseBuild=true

      - name: Verify the packages
        run: dotnet run eng/verify-packages.cs -- artifacts/packages

      - name: Upload the packages (inspection only, never published from here)
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/
          retention-days: 14

  # The PostgreSQL matrix (story 6.3, KL-13): the storage suites, the pgvector proof, the sample's PostgreSQL
  # mode and the upgrades from the published previews' databases (story 12.1), on every supported major. One
  # variable picks both the pgvector image and the stock one, and each suite asserts the server it reached reports
  # that major, so a leg cannot quietly run the default. The list must equal PostgresTestImage.SupportedMajors; a
  # release test checks it.
  postgres:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        postgres: [15, 16, 17, 18]
    name: postgres (${{ matrix.postgres }})
    env:
      AGENTEXPERIENCE_POSTGRES_MAJOR: ${{ matrix.postgres }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Local development may roll forward (global.json: latestFeature). CI may not: the runner image ships
      # newer SDK bands, which would otherwise win. Disabling roll-forward here makes setup-dotnet install,
      # and the host select, exactly the pinned SDK. The working copy is the runner's; nothing is committed.
      - name: Pin the SDK exactly (CI only)
        run: |
          sed -i -E 's/"rollForward": *"[^"]*"/"rollForward": "disable"/' global.json
          grep -q '"rollForward": "disable"' global.json

      # Exactly global.json's SDK (asserted below). It carries the net10.0 runtime every project targets, so nothing
      # else is installed.
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Belt and braces after the pin above: a different SDK fails here instead of silently winning.
      - name: Assert the exact pinned SDK
        run: |
          pinned="$(sed -nE 's/.*"version": *"([^"]+)".*/\1/p' global.json)"
          actual="$(dotnet --version)"
          test "$actual" = "$pinned" || { echo "::error::SDK $actual is in use, but global.json pins $pinned"; exit 1; }
          echo "SDK $actual, as pinned"

      - name: Restore
        run: dotnet restore --locked-mode

      # Story 12.1: the upgrade suite's seeders pin the published previews' packages and are not in the solution.
      # Restoring them here, locked, puts those packages in the cache, so the test step builds them without network.
      - name: Restore the upgrade seeders
        run: |
          set -euo pipefail
          for seeder in tests/AgentExperience.Upgrade.Seeders/Preview*/; do
            dotnet restore "$seeder" --locked-mode
          done

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test the storage suites on PostgreSQL ${{ matrix.postgres }}
        run: |
          set -euo pipefail
          failed=0
          for project in \
            tests/AgentExperience.Storage.Postgres.Tests \
            tests/AgentExperience.Storage.Postgres.Vectors.Tests \
            tests/AgentExperience.CompatibilityProof \
            tests/AgentExperience.Sample.EndToEnd.Tests \
            tests/AgentExperience.Upgrade.Tests \
            tests/AgentExperience.Contract.Tests; do
            dotnet test "$project" --no-build --configuration Release || failed=1
          done
          exit "$failed"

      # Story 6.4 (KL-2): the store and vector suites again, unmodified, in crypto-shredding mode. The variable sets
      # the internal, test-only ExperienceEncryption.TestSuiteDefault, so every component a test builds without an
      # encryption of its own seals what it writes -- the whole suite, not a selection, on every framework.
      - name: Test the storage suites in crypto-shredding mode on PostgreSQL ${{ matrix.postgres }}
        env:
          AGENTEXPERIENCE_TEST_ENCRYPTION: 'on'
        run: |
          set -euo pipefail
          failed=0
          for project in \
            tests/AgentExperience.Storage.Postgres.Tests \
            tests/AgentExperience.Storage.Postgres.Vectors.Tests; do
            dotnet test "$project" --no-build --configuration Release || failed=1
          done
          exit "$failed"

      # Story 15.1: the store, vector (with the conformance suites they host), sample and upgrade suites again, with
      # PostgreSQL row-level security on. The variable sets the internal, test-only
      # ExperienceApplicationRoleOptions.TestSuiteRowLevelSecurity, so every privileges call the fixtures and the tests
      # make enables it, and every store runs as the application role behind the policies.
      - name: Test the storage suites with row-level security on PostgreSQL ${{ matrix.postgres }}
        env:
          AGENTEXPERIENCE_TEST_RLS: 'on'
        run: |
          set -euo pipefail
          failed=0
          for project in \
            tests/AgentExperience.Storage.Postgres.Tests \
            tests/AgentExperience.Storage.Postgres.Vectors.Tests \
            tests/AgentExperience.Sample.EndToEnd.Tests \
            tests/AgentExperience.Upgrade.Tests; do
            dotnet test "$project" --no-build --configuration Release || failed=1
          done
          exit "$failed"

      # Story 15.1: both modes at once -- row-level security on and every component sealing what it writes.
      - name: Test the storage suites with row-level security and crypto-shredding on PostgreSQL ${{ matrix.postgres }}
        env:
          AGENTEXPERIENCE_TEST_RLS: 'on'
          AGENTEXPERIENCE_TEST_ENCRYPTION: 'on'
        run: |
          set -euo pipefail
          failed=0
          for project in \
            tests/AgentExperience.Storage.Postgres.Tests \
            tests/AgentExperience.Storage.Postgres.Vectors.Tests; do
            dotnet test "$project" --no-build --configuration Release || failed=1
          done
          exit "$failed"

  # The floating-dependency leg (story 6.3, KL-13). Every shipping reference is a floor, which admits every later
  # release in its major (Microsoft.Agents.AI's range stops at its next major, so floating within the major stays
  # inside it). The build-and-test job proves the floors themselves;
  # this proves the newest release in each major, with the whole suite. It GATES on push and on the weekly
  # schedule: a floor makes a support claim for those versions, so a release that breaks the library breaks
  # hosts, and main must go red. On a pull request it runs and reports in the job summary but does not
  # block, so an unrelated PR is not held hostage to a release that shipped that morning (the AD-F reasoning
  # behind the MAF probe). Triage for a red run: raise the floor past the broken release, or fix the library.
  floating-dependencies:
    runs-on: ubuntu-24.04
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Local development may roll forward (global.json: latestFeature). CI may not: the runner image ships
      # newer SDK bands, which would otherwise win. Disabling roll-forward here makes setup-dotnet install,
      # and the host select, exactly the pinned SDK. The working copy is the runner's; nothing is committed.
      - name: Pin the SDK exactly (CI only)
        run: |
          sed -i -E 's/"rollForward": *"[^"]*"/"rollForward": "disable"/' global.json
          grep -q '"rollForward": "disable"' global.json

      # Exactly global.json's SDK (asserted below). It carries the net10.0 runtime every project targets, so nothing
      # else is installed.
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Belt and braces after the pin above: a different SDK fails here instead of silently winning.
      - name: Assert the exact pinned SDK
        run: |
          pinned="$(sed -nE 's/.*"version": *"([^"]+)".*/\1/p' global.json)"
          actual="$(dotnet --version)"
          test "$actual" = "$pinned" || { echo "::error::SDK $actual is in use, but global.json pins $pinned"; exit 1; }
          echo "SDK $actual, as pinned"

      - name: Float every floor to the newest release in its major, and test
        run: eng/probe-floating-dependencies.sh

  # The MAF compatibility matrix (story 4.3, AD-F; story 7.2, KL-13). The adapter declares Microsoft.Agents.AI as a
  # range, [floor, next major). The pinned leg runs the floor, from the committed lock files, and always gates. The
  # latest leg runs the newest stable version inside the range, which a host resolves with no warning, so it is a
  # support claim too: it GATES on push and on the weekly schedule, like the floating-dependency leg, and on a pull
  # request reports PASSED or FAILED in the job summary without blocking, so an unrelated PR is not held hostage to
  # a MAF release that shipped that morning. Triage for a red latest leg: fix the adapter, or raise the floor.
  maf-compatibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        leg: [pinned, latest]
    continue-on-error: ${{ matrix.leg == 'latest' && github.event_name == 'pull_request' }}
    name: maf-compatibility (${{ matrix.leg }})
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Local development may roll forward (global.json: latestFeature). CI may not: the runner image ships
      # newer SDK bands, which would otherwise win. Disabling roll-forward here makes setup-dotnet install,
      # and the host select, exactly the pinned SDK. The working copy is the runner's; nothing is committed.
      - name: Pin the SDK exactly (CI only)
        run: |
          sed -i -E 's/"rollForward": *"[^"]*"/"rollForward": "disable"/' global.json
          grep -q '"rollForward": "disable"' global.json

      # Exactly global.json's SDK (asserted below). It carries the net10.0 runtime every project targets, so nothing
      # else is installed.
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Belt and braces after the pin above: a different SDK fails here instead of silently winning.
      - name: Assert the exact pinned SDK
        run: |
          pinned="$(sed -nE 's/.*"version": *"([^"]+)".*/\1/p' global.json)"
          actual="$(dotnet --version)"
          test "$actual" = "$pinned" || { echo "::error::SDK $actual is in use, but global.json pins $pinned"; exit 1; }
          echo "SDK $actual, as pinned"

      - name: Probe Microsoft.Agents.AI (${{ matrix.leg }})
        run: eng/probe-maf-version.sh ${{ matrix.leg == 'pinned' && 'pinned' || '' }}

  # The Python port (python/): a pure-Python core that implements the language-neutral contract (contract/), and its
  # Microsoft Agent Framework integration (the maf extra, story 22.3). Lint, strict typing, the unit, conformance and
  # MAF tests (the quick-start sample included), and the built wheel on every supported CPython (3.10 to 3.14), with the
  # MAF tests repeated on the lowest and on the newest agent-framework-core the maf extra allows; then the PostgreSQL leg, which writes
  # the finalize fixtures through the Python store, runs every search fixture, and runs the cross-language proof (a
  # .NET-finalized lesson injected into a Python agent, and the raw rows a Python agent wrote checked; the .NET half
  # of that proof is AgentExperience.Contract.Tests' PythonAgentRecordsPostgresRoundTripTests), on the oldest and newest
  # majors the contract tests cover. The leg sets AGENTEXPERIENCE_REQUIRE_POSTGRES, so it fails rather than skips
  # without Docker, and AGENTEXPERIENCE_POSTGRES_MAJOR, which the tests assert the server reports.
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
          - python-version: '3.11'
          - python-version: '3.12'
          - python-version: '3.13'
          - python-version: '3.14'
          - python-version: '3.13'
            pg-major: 16
          - python-version: '3.13'
            pg-major: 18
    name: python (${{ matrix.python-version }}${{ matrix.pg-major && format(', PostgreSQL {0}', matrix.pg-major) || '' }})
    defaults:
      run:
        working-directory: python
    env:
      # testcontainers-python prepends the prefix as written, so it carries its own slash.
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install (locked)
        run: uv sync --locked --extra maf --extra postgres

      - name: Lint
        if: ${{ !matrix.pg-major }}
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Type-check (mypy --strict)
        if: ${{ !matrix.pg-major }}
        run: uv run mypy --strict src tests

      - name: Unit and conformance tests
        if: ${{ !matrix.pg-major }}
        run: uv run pytest -m "not postgres"

      # The maf extra's floor: the MAF tests again on the lowest agent-framework-core it allows, so the floor is tested,
      # not assumed. Installed over the locked environment and run without re-syncing it.
      - name: MAF tests on the lowest agent-framework-core the maf extra allows
        if: ${{ !matrix.pg-major }}
        run: |
          set -euo pipefail
          floor="$(sed -nE 's/^maf = \["agent-framework-core>=([0-9.]+)"\]$/\1/p' pyproject.toml)"
          test -n "$floor"
          uv pip install "agent-framework-core==$floor"
          uv run --no-sync python -c "import importlib.metadata as m; v = m.version('agent-framework-core'); assert v == '$floor', v; print('agent-framework-core', v)"
          uv run --no-sync pytest -m "not postgres" tests/test_maf.py tests/test_maf_holdout.py tests/test_maf_benefit.py tests/test_quickstart.py tests/test_cross_language.py tests/test_cross_language_holdout.py tests/test_maf_provider_holdout.py tests/test_cross_language_provider.py

      # The maf extra's ceiling: the same tests on the newest agent-framework-core PyPI serves, so a MAF release that breaks
      # the integration is seen in the next CI run (or the weekly one) and not by a user. The extra claims every later
      # release, so the newest one has to pass. Installed over the floor leg's environment, without re-syncing the lock.
      - name: MAF tests on the newest agent-framework-core
        if: ${{ !matrix.pg-major }}
        run: |
          set -euo pipefail
          uv pip install --upgrade "agent-framework-core"
          uv run --no-sync python -c "import importlib.metadata as m; print('agent-framework-core', m.version('agent-framework-core'))"
          uv run --no-sync pytest -m "not postgres" tests/test_maf.py tests/test_maf_holdout.py tests/test_maf_benefit.py tests/test_quickstart.py tests/test_cross_language.py tests/test_cross_language_holdout.py tests/test_maf_provider_holdout.py tests/test_cross_language_provider.py

      # The wheel, not the source tree: built, installed into a clean environment outside the checkout, and imported,
      # so the packaged SQL files and py.typed are proven to ship.
      - name: Build the wheel and import it from a clean environment
        if: ${{ !matrix.pg-major }}
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          uv build --wheel --out-dir "$out/dist"
          uv venv --python "${{ matrix.python-version }}" "$out/venv"
          uv pip install --python "$out/venv/bin/python" "$out"/dist/*.whl
          cd "$out"
          "$out/venv/bin/python" - <<'PY'
          from importlib import resources

          import agentexperience
          from agentexperience.postgres import contract_sql

          assert "set_config" in contract_sql("declare-bounds.sql")
          assert "search_experience_text" in contract_sql("search-experience-text.sql")
          assert resources.files("agentexperience").joinpath("py.typed").is_file()
          print("agentexperience", agentexperience.__version__, "imports from the wheel")

          # The core has no runtime dependency: the integration needs the maf extra, and says so by failing to import.
          try:
              import agentexperience.maf
          except ImportError:
              print("agentexperience.maf needs the maf extra, as it should")
          else:
              raise AssertionError("agentexperience.maf imported without agent-framework-core")

          # Nor does the core import OpenTelemetry: the adapter needs the otel extra, and says so.
          try:
              import agentexperience.telemetry
          except ImportError:
              print("agentexperience.telemetry needs the otel extra, as it should")
          else:
              raise AssertionError("agentexperience.telemetry imported without opentelemetry-api")
          PY
          wheels=("$out"/dist/*.whl)
          test "${#wheels[@]}" -eq 1 || { echo "::error::expected exactly one wheel, found ${#wheels[@]}"; exit 1; }
          uv pip install --python "$out/venv/bin/python" "${wheels[0]}[maf]"
          "$out/venv/bin/python" -c "import agentexperience.maf as maf; print('agentexperience.maf imports with the maf extra:', maf.use_agent_experience.__name__)"
          uv pip install --python "$out/venv/bin/python" "${wheels[0]}[otel]"
          "$out/venv/bin/python" -c "import agentexperience.telemetry as t; print('agentexperience.telemetry imports with the otel extra:', t.enable.__name__)"

      - name: PostgreSQL ${{ matrix.pg-major }} conformance tests
        if: ${{ matrix.pg-major }}
        env:
          AGENTEXPERIENCE_POSTGRES_MAJOR: ${{ matrix.pg-major }}
          AGENTEXPERIENCE_REQUIRE_POSTGRES: '1'
        run: uv run pytest -m postgres

  # The Go port (go/): two modules. The core (go/) implements the language-neutral contract (contract/) and requires no
  # module at all; the PostgreSQL store (go/postgres/, its own module) adds pgx, and its tests carry the JSON Schema check
  # and testcontainers-go. No Microsoft Agent Framework integration yet. For each module: go mod tidy must change
  # nothing, gofmt, go vet, staticcheck and govulncheck (pinned releases, on a 1.26 leg: staticcheck v0.8.1 needs
  # Go 1.26 and cannot read the export data of a newer Go), then the unit and conformance tests with the race detector, on the lowest Go each module
  # declares (its go line: 1.24 for the core; 1.25 for the store, which pgx's fixed releases need) and the latest
  # stable. Then the PostgreSQL leg (the postgres build tag, race detector
  # on), which writes every finalize fixture through the Go store and reads it back row for row, runs every search
  # fixture, and uses the store from many goroutines at once, on the oldest and newest majors the contract tests cover.
  # The leg uses the pgvector/pgvector image (contract 1.6's vector fixtures need the extension). The leg sets
  # AGENTEXPERIENCE_REQUIRE_POSTGRES, so it fails rather than skips without Docker, and
  # AGENTEXPERIENCE_POSTGRES_MAJOR, which the tests assert the server reports. testcontainers-go prepends the
  # workflow's TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX as a path, so it needs no slash.
  go:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Six modules, each with its own floor: the core (.) Go 1.24; the PostgreSQL store (postgres) and the
          # in-memory store (inmemory) 1.25 (the pgx and golang.org/x/text releases without known vulnerabilities
          # need it); the Agent Framework integration (maf) 1.26, the Go SDK's own minimum; the PostgreSQL test
          # support with the store's PostgreSQL tests (postgres/pgtest) 1.26, where its container library's
          # dependencies have no known vulnerabilities; and the optional OpenTelemetry adapter (telemetry) 1.26,
          # which the OpenTelemetry API's own releases need. Each leg runs every module its Go version can build; the
          # PostgreSQL legs run the two modules with PostgreSQL tests (the postgres build tag).
          - go-version: '1.24.x'
            modules: '.'
          - go-version: '1.25.x'
            modules: '. postgres inmemory'
          - go-version: '1.26.x'
            modules: '. postgres postgres/pgtest inmemory maf telemetry'
          - go-version: stable
            modules: '. postgres postgres/pgtest inmemory maf telemetry'
          - go-version: stable
            modules: 'postgres/pgtest maf'
            pg-major: 16
          - go-version: stable
            modules: 'postgres/pgtest maf'
            pg-major: 18
    name: go (${{ matrix.go-version }}${{ matrix.pg-major && format(', PostgreSQL {0}', matrix.pg-major) || '' }})
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          # Resolve to the newest patch release, not a cached manifest's older one: govulncheck reports
          # standard-library fixes, which arrive as patch releases.
          check-latest: true
          cache-dependency-path: |
            go/postgres/go.sum
            go/postgres/pgtest/go.sum
            go/inmemory/go.sum
            go/maf/go.sum
            go/telemetry/go.sum

      - name: The modules' dependencies are tidy and verified
        run: |
          set -euo pipefail
          for module in ${{ matrix.modules }}; do
            (
              cd "$module"
              go mod verify
              saved="$RUNNER_TEMP/$(basename "$PWD")"
              mkdir -p "$saved"
              cp go.mod "$saved/"
              if [ -f go.sum ]; then cp go.sum "$saved/"; fi
              go mod tidy
              diff -u "$saved/go.mod" go.mod
              if [ -f go.sum ] || [ -f "$saved/go.sum" ]; then diff -u "$saved/go.sum" go.sum; fi
            )
          done
          # The core requires no module at all.
          if grep -q require go.mod; then echo "::error::go/go.mod requires a module"; exit 1; fi

      - name: gofmt (no file may need formatting)
        if: ${{ !matrix.pg-major }}
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || { echo "::error::gofmt would reformat: $unformatted"; exit 1; }

      - name: go vet
        if: ${{ !matrix.pg-major }}
        run: |
          set -euo pipefail
          for module in ${{ matrix.modules }}; do
            (
              cd "$module"
              go vet ./...
              # Only these two modules have PostgreSQL tests (the postgres build tag).
              case "$module" in postgres/pgtest|maf) go vet -tags postgres ./... ;; esac
            )
          done

      - name: staticcheck and govulncheck
        if: ${{ !matrix.pg-major && matrix.go-version == '1.26.x' }}
        run: |
          set -euo pipefail
          for module in ${{ matrix.modules }}; do
            (
              cd "$module"
              go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
              go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
              case "$module" in
                postgres/pgtest|maf)
                  go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 -tags postgres ./...
                  go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -tags postgres ./...
                  ;;
              esac
            )
          done

      - name: Unit and conformance tests (race detector on)
        if: ${{ !matrix.pg-major }}
        run: |
          set -euo pipefail
          for module in ${{ matrix.modules }}; do
            (cd "$module" && go test -race ./...)
          done

      - name: PostgreSQL ${{ matrix.pg-major }} conformance and cross-language tests (race detector on)
        if: ${{ matrix.pg-major }}
        env:
          AGENTEXPERIENCE_POSTGRES_MAJOR: ${{ matrix.pg-major }}
          AGENTEXPERIENCE_REQUIRE_POSTGRES: '1'
        run: |
          set -euo pipefail
          for module in ${{ matrix.modules }}; do
            (cd "$module" && go test -race -tags postgres ./...)
          done

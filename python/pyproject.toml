[project]
# The distribution and import names are provisional until the maintainer picks the package's name. They live here
# (name) and in the src/agentexperience directory; renaming the package touches only those two places.
name = "agentexperience"
version = "0.1.0.dev0"
description = "Verified agent experience for Python: a pure-Python core that passes the AgentExperience.NET language-neutral contract 1.0."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "AgentExperience contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
# Microsoft Agent Framework for Python: 1.0.0 is the lowest release whose APIs agentexperience.maf uses (CI tests it).
maf = ["agent-framework-core>=1.0.0"]

[project.urls]
Repository = "https://github.com/fabbrik/AgentExperience.NET"

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.23",
    "mypy>=1.13",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.8",
    "psycopg[binary]>=3.2",
    "agent-framework-core>=1.0.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentexperience"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs PostgreSQL (Docker through Testcontainers, or a server named by PGHOST, PGPORT, PGUSER and PGPASSWORD)"]
addopts = "-ra"

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.format]
# The README's quick start is laid out as the five lines it promises, not as the formatter would spread it.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[project]
name = "agentexperience"
# Derived from Directory.Build.props, never set on its own: 0.1.0-preview.N there is 0.1.0aN here (an explicit PEP 440
# alpha; "preview" would normalise to rc), and a version with no suffix is the same here. RELEASING.md bumps both, and a
# release test and release.yml fail when they disagree.
version = "0.1.0a14"
description = "Verified agent experience for Python: a pure-Python core that passes the AgentExperience.NET language-neutral contract 1.2."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "AgentExperience contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
# Microsoft Agent Framework for Python: 1.0.0 is the lowest release whose APIs agentexperience.maf uses (CI tests it).
maf = ["agent-framework-core>=1.0.0"]

[project.urls]
Repository = "https://github.com/fabbrik/AgentExperience.NET"

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.23",
    "mypy>=1.13",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.8",
    "psycopg[binary]>=3.2",
    "agent-framework-core>=1.0.0",
]

[build-system]
# One exact hatchling, so the sdist and wheel a release builds and publishes come from a known build backend, not
# whichever release PyPI serves on the day of the tag (uv.lock does not cover the build environment). Bump it
# deliberately.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentexperience"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs PostgreSQL (Docker through Testcontainers, or a server named by PGHOST, PGPORT, PGUSER and PGPASSWORD)"]
addopts = "-ra"

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.format]
# The README's quick start is laid out as the five lines it promises, not as the formatter would spread it.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
